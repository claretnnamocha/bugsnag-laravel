# Added by TAD (The Agnostic Dev). Checks TAD's pull requests before
# TAD reviews them: install, build, tests.
# Runs only on TAD's branches (tad/...). Optional: add a repository secret
# TAD_QA_ENV with the .env lines this app needs to build and start.
name: TAD QA
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: tad-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    name: TAD QA
    if: startsWith(github.head_ref, 'tad/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: App settings
        env:
          TAD_QA_ENV: ${{ secrets.TAD_QA_ENV }}
        run: if [ -n "$TAD_QA_ENV" ]; then printf '%s\n' "$TAD_QA_ENV" >> .env; fi
      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
      - name: Build
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Test
        run: |
          vendor/bin/phpunit
